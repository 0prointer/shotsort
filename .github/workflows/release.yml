# Baut ShotSort auf GitHub und veröffentlicht eine neue Version.
# Starten: auf GitHub unter "Actions" → "Neue Version veröffentlichen" → "Run workflow", Versionsnummer eingeben.
# Die Versionsnummer steht in src-tauri/Cargo.toml ("version") und muss mit der Eingabe übereinstimmen.
name: Neue Version veröffentlichen
# Titel des Laufs in der Liste, z. B. „ShotSort 1.1.4 veröffentlichen“
run-name: ShotSort ${{ inputs.version }} veröffentlichen

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (muss mit src-tauri/Cargo.toml übereinstimmen, z. B. 1.1.4)'
        required: true
        type: string

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Bricht sofort ab, wenn es diese Version schon gibt – dann würde kein Update ankommen.
      - name: Version prüfen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "Version laut src-tauri/Cargo.toml: $v"
          want="${INPUT_VERSION#v}"
          if [ "$want" != "$v" ]; then
            echo "::error title=Version passt nicht::Eingegeben wurde $want, in src-tauri/Cargo.toml steht $v. Bitte dieselbe Nummer eingeben – oder Cargo.toml anpassen, committen und pushen."
            exit 1
          fi
          if gh release view "v$v" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "::error title=Version $v gibt es schon::Bitte in src-tauri/Cargo.toml die Version erhöhen (z. B. auf die nächste Nummer), committen, pushen und den Workflow erneut starten."
            exit 1
          fi
          echo "v$v ist neu – es geht los."

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ShotSort __VERSION__
          releaseBody: 'Zum Installieren die Datei ShotSort_..._x64-setup.exe herunterladen (oder einfach über https://0prointer.github.io/shotsort). Bereits installierte Versionen aktualisieren sich von selbst.'
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json

