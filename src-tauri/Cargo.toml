[package]
name = "shotsort"
version = "1.3.0"
description = "Fotos schnell aussortieren und in Zielordner kopieren"
edition = "2021"

[lib]
name = "shotsort_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# ab 2.5.5 wird die Sperre vor einem Neustart freigegeben (wichtig für den Neustart nach Updates)
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
kamadak-exif = "0.5"
walkdir = "2"
trash = "5"
fs2 = "0.4"

# Bilder dekodieren ist im Debug-Modus sehr langsam.
# Diese Einstellungen machen "cargo tauri dev" deutlich flotter.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
